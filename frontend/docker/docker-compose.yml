services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ../.env
    environment:
      PORT: 3000
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
