name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

env:
  NODE_VERSION: "22.23.3"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate pull request source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "Base 'main' só aceita merge da branch 'dev' (origem: '$HEAD_REF')."
            exit 1
          fi

  backend-quality:
    name: Backend / Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build

  backend-unit:
    name: Backend / Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:unit

  backend-integration:
    name: Backend / Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - name: Pre-pull Testcontainers image
        run: docker pull postgres:16
      - run: npm run test:integration

  backend-e2e:
    name: Backend / E2E (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        # GitHub-hosted runners do not have Docker Hub's public-image pull limit.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://127.0.0.1:6379
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - name: Pre-pull Testcontainers image
        run: docker pull postgres:16
      - run: npm run test:e2e -- --no-file-parallelism --shard=${{ matrix.shard }}/3

  backend:
    name: backend
    if: always()
    needs:
      - backend-quality
      - backend-unit
      - backend-integration
      - backend-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify backend checks
        env:
          QUALITY_RESULT: ${{ needs.backend-quality.result }}
          UNIT_RESULT: ${{ needs.backend-unit.result }}
          INTEGRATION_RESULT: ${{ needs.backend-integration.result }}
          E2E_RESULT: ${{ needs.backend-e2e.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ] || \
             [ "$UNIT_RESULT" != "success" ] || \
             [ "$INTEGRATION_RESULT" != "success" ] || \
             [ "$E2E_RESULT" != "success" ]; then
            echo "Um ou mais checks do backend falharam ou foram cancelados."
            exit 1
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
